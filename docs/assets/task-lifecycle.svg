<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">How one task is built, solved, graded and calibrated</text>

  <!-- authoring side -->
  <rect x="24" y="56" width="400" height="190" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="40" y="78" font-size="12" font-weight="600" fill="#59636e">HIDDEN FROM THE AGENT</text>
  <rect x="40" y="92" width="170" height="56" rx="6" fill="#ffffff" stroke="#4a72b0"/>
  <text x="125" y="115" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">rubric.md</text>
  <text x="125" y="133" font-size="11" text-anchor="middle" fill="#59636e">root cause, checks, hard fails</text>
  <rect x="238" y="92" width="170" height="56" rx="6" fill="#ffffff" stroke="#4a72b0"/>
  <text x="323" y="115" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">solution.patch</text>
  <text x="323" y="133" font-size="11" text-anchor="middle" fill="#59636e">reference fix, run by author</text>
  <rect x="40" y="168" width="170" height="56" rx="6" fill="#ffffff" stroke="#4a72b0"/>
  <text x="125" y="191" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">grader/</text>
  <text x="125" y="209" font-size="11" text-anchor="middle" fill="#59636e">7 checks on a live server</text>
  <rect x="238" y="168" width="170" height="56" rx="6" fill="#ffffff" stroke="#4a72b0"/>
  <text x="323" y="191" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">authoring/</text>
  <text x="323" y="209" font-size="11" text-anchor="middle" fill="#59636e">log generator, difficulty knobs</text>

  <!-- agent side -->
  <rect x="476" y="56" width="400" height="190" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="492" y="78" font-size="12" font-weight="600" fill="#59636e">WHAT THE AGENT GETS</text>
  <rect x="492" y="92" width="170" height="56" rx="6" fill="#ffffff" stroke="#1a7f37"/>
  <text x="577" y="115" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">prompt.md</text>
  <text x="577" y="133" font-size="11" text-anchor="middle" fill="#59636e">PagerDuty-style alert</text>
  <rect x="690" y="92" width="170" height="56" rx="6" fill="#ffffff" stroke="#1a7f37"/>
  <text x="775" y="115" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">env/ (copy)</text>
  <text x="775" y="133" font-size="11" text-anchor="middle" fill="#59636e">broken service, logs, tools</text>
  <rect x="590" y="168" width="170" height="56" rx="6" fill="#ffffff" stroke="#1a7f37"/>
  <text x="675" y="191" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">agent edits env/</text>
  <text x="675" y="209" font-size="11" text-anchor="middle" fill="#59636e">claude -p, Bash/Read/Edit</text>
  <line x1="577" y1="148" x2="640" y2="166" stroke="#59636e" marker-end="url(#a)"/>
  <line x1="775" y1="148" x2="712" y2="166" stroke="#59636e" marker-end="url(#a)"/>

  <!-- grading row -->
  <rect x="180" y="290" width="240" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="300" y="317" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">validate.py --candidate</text>
  <text x="300" y="336" font-size="11" text-anchor="middle" fill="#59636e">grader + leak and hard-fail checks</text>
  <rect x="480" y="290" width="240" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="600" y="317" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">calibration.md</text>
  <text x="600" y="336" font-size="11" text-anchor="middle" fill="#59636e">pass rate over 10 runs vs 20-60 % target</text>

  <line x1="640" y1="224" x2="360" y2="288" stroke="#59636e" marker-end="url(#a)"/>
  <line x1="125" y1="224" x2="240" y2="288" stroke="#59636e" marker-end="url(#a)"/>
  <line x1="420" y1="325" x2="478" y2="325" stroke="#59636e" marker-end="url(#a)"/>
  <path d="M720 325 H 866 V 262 H 330 V 228" fill="none" stroke="#cf222e" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="856" y="294" font-size="11" fill="#cf222e" text-anchor="end">too easy or too hard:</text>
  <text x="856" y="309" font-size="11" fill="#cf222e" text-anchor="end">turn a knob, re-run</text>
</svg>
