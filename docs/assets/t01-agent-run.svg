<svg xmlns='http://www.w3.org/2000/svg' width='788' height='374' viewBox='0 0 788 374'><rect width='100%' height='100%' fill='#ffffff' rx='8'/><rect width='100%' height='100%' fill='#0d1117' rx='8'/><circle cx='20' cy='18' r='5' fill='#ff5f56'/><circle cx='36' cy='18' r='5' fill='#ffbd2e'/><circle cx='52' cy='18' r='5' fill='#27c93f'/><text x='394.0' y='22' font-size='12' fill='#8b949e' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>One recorded agent run (tool calls, answer, grade)</text><text x='14' y='54' font-size='12' fill='#79c0ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>$ claude -p "$(cat prompt.md)"   # runs-2026-11-17c/run-03, fresh copy of env/</text><text x='14' y='71' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  find . -type f | grep -v pycache | head -50; wc -l logs/*; cat service/*.py; head -30 logs/…</text><text x='14' y='88' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  cat service/handlers/*.py tools/send_test_event.py tools/samples/*.json; cat tests/test_web…</text><text x='14' y='105' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  cat docs/erp-connector.md | head -40; grep -n "stepped\|signature mismatch" logs/mes-webhoo…</text><text x='14' y='122' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  S=/private/tmp/claude-501/-private-var-folders-7d-j58hwvpd4t3csmchy9y9kq600000gn-T-t01-ws-9…</text><text x='14' y='139' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  python3 - &lt;&lt;'EOF'</text><text x='14' y='156' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'></text><text x='14' y='173' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>I found and fixed the root cause. All 10 tests pass, and the replay tool now gets `202` for an</text><text x='14' y='190' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>event that was getting `401` before. Cause: `service/middleware.py` parses every webhook body and</text><text x='14' y='207' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>re-encodes it with `json.dumps(data)` before the signature is checked, and that function turns</text><text x='14' y='224' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>non-ASCII characters into `\uXXXX` escapes. Forgeline signs the exact UTF-8 bytes it sends, so any</text><text x='14' y='241' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>event containing a non-ASCII character fails the check, such as an operator named "Łukasz Wójcik"</text><text x='14' y='258' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>or a note like "Prüfung". That's why only some work orders are stuck, at every plant: it depends</text><text x='14' y='275' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>on the text in each event, not on where it came from. The logs show the mismatches starting on</text><text x='14' y='292' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>2026-11-14 at about 15:36 UTC. I'm assuming that's when non-ASCII text started showing up in</text><text x='14' y='309' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>Forgeline's events; the logs don't say why. What I checked: - Replaying the captured sample with</text><text x='14' y='326' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'></text><text x='14' y='343' font-size='12' fill='#7ee787' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>grader: PASS (all grader checks)</text></svg>
