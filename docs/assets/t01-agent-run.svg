<svg xmlns='http://www.w3.org/2000/svg' width='788' height='408' viewBox='0 0 788 408'><rect width='100%' height='100%' fill='#ffffff' rx='8'/><rect width='100%' height='100%' fill='#0d1117' rx='8'/><circle cx='20' cy='18' r='5' fill='#ff5f56'/><circle cx='36' cy='18' r='5' fill='#ffbd2e'/><circle cx='52' cy='18' r='5' fill='#27c93f'/><text x='394.0' y='22' font-size='12' fill='#8b949e' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>One recorded agent run (tool calls, answer, grade)</text><text x='14' y='54' font-size='12' fill='#79c0ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>$ claude -p "$(cat prompt.md)"   # runs-2026-11-17b/run-03, fresh copy of env/</text><text x='14' y='71' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  find . -type f | grep -v .git/ | head -50; wc -l logs/*; cat service/*.py | head -300</text><text x='14' y='88' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  cat tools/send_test_event.py; awk '{print $3, $5, $6}' logs/mes-webhook.log | sed 's/=.*//'…</text><text x='14' y='105' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  grep chrony logs/mes-webhook.log; grep "clock skew" logs/mes-webhook.log | awk '{print $7}'…</text><text x='14' y='122' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  (PORT=8091 python3 -m service.mes_webhook 2&gt;/dev/null &amp;) ; sleep 1; python3 tools/send_test…</text><text x='14' y='139' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  PORT=8091 python3 -m service.mes_webhook &gt; /dev/null 2&gt;&amp;1 &amp; SP=$!; for i in 1 2 3 4 5 6 7 8…</text><text x='14' y='156' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Edit  service/mes_webhook.py</text><text x='14' y='173' font-size='12' fill='#d2a8ff' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>&gt; Bash  PORT=8091 python3 -m service.mes_webhook &gt; /dev/null 2&gt;&amp;1 &amp; SP=$!; for i in 1 2 3 4 5 6 7 8…</text><text x='14' y='190' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'></text><text x='14' y='207' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>I found the cause and fixed it in `service/mes_webhook.py`. Root cause: The service didn't check</text><text x='14' y='224' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>the HMAC against the bytes Forgeline actually sent. It parsed the JSON, re-serialized it with</text><text x='14' y='241' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>`json.dumps(event)` and checked the signature against that output. Python's default `json.dumps`</text><text x='14' y='258' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>turns non-ASCII characters into `\uXXXX` escapes, so any event with an accented name (operators</text><text x='14' y='275' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>like "Łukasz Wójcik" or "Nguyễn Văn An") produced different bytes and failed as a "signature</text><text x='14' y='292' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>mismatch". That's why only some work orders got stuck, and why every plant was affected. The</text><text x='14' y='309' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>clock-skew warnings at VN-BD are a red herring: the largest skew in the logs is 4.5s against a</text><text x='14' y='326' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>300s tolerance, and nothing was rejected as stale. All 2,898 rejections were signature mismatches.</text><text x='14' y='343' font-size='12' fill='#c9d1d9' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>Fix: - The service now checks the HMAC against the raw request body, exactly as received. - It</text><text x='14' y='360' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'></text><text x='14' y='377' font-size='12' fill='#7ee787' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>grader: PASS (7/7 checks)</text></svg>
