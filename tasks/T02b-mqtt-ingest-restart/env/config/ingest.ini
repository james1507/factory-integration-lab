[broker]
host = 127.0.0.1
port = 1883
client_prefix = ingest
; lowered from 60 in 2.4.0 so dead connections are noticed faster (OPS-2288)
keepalive = 10
; keep subscriptions and queued readings across reconnects
clean_session = false

[ingest]
plant = dus
lines = 1,2,3
; scaled from 1 to 3 workers in 2.4.0 to keep up with line 3 (OPS-2291)
workers = 3

[store]
path = data/readings.db

[backoff]
initial = 0.2
max = 5
